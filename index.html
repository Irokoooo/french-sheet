<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eee9e0"><link rel="manifest" href="manifest.webmanifest"><title>French Sheet</title><style>:root{--paper:#f2efe7;--ink:#292925;--muted:#777269;--accent:#7d8c79;--rule:#cec8bc;--fs:20px;--lh:2.15;--pad:8.5%}*{box-sizing:border-box}body{margin:0;background:#d7d3cc;color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,sans-serif}.app{max-width:1400px;margin:auto;padding:14px}.toolbar{position:sticky;top:0;z-index:5;display:flex;gap:9px;align-items:center;flex-wrap:wrap;background:#f6f3eddd;backdrop-filter:blur(14px);padding:11px;border-radius:16px}.brand{font:700 15px Georgia,serif;letter-spacing:.12em;margin-right:auto}button{border:1px solid #0002;background:#fff;color:#282722;padding:9px 12px;border-radius:11px}.primary{background:var(--ink);color:#fff}.swatch{width:29px;height:29px;border-radius:50%;padding:0;border:2px solid #fff;box-shadow:0 0 0 1px #0002}.layout{display:grid;grid-template-columns:.72fr 1.28fr;gap:14px;margin-top:14px}.panel{background:#f6f3edbb;padding:13px;border-radius:16px}textarea{width:100%;min-height:330px;border:0;border-radius:12px;padding:15px;resize:vertical;font:15px/1.6 ui-monospace,SFMono-Regular,monospace;outline:none}.settings{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.settings label{font-size:12px;color:#6e6960}.settings input[type=range]{width:100%}.hint{font-size:11px;line-height:1.5;color:#777168}.stage{overflow:auto;background:#c9c5be;padding:12px;border-radius:16px}.sheet{width:min(100%,820px);aspect-ratio:210/297;min-height:1120px;margin:auto;background:var(--paper);padding:var(--pad);box-shadow:0 20px 50px #332b201d;position:relative;overflow:hidden}.mast{display:flex;justify-content:space-between;border-top:4px solid var(--ink);padding-top:11px}.kicker,.date{font-size:10px;letter-spacing:.16em;text-transform:uppercase}.kicker{color:var(--accent);font-weight:800}.date{color:var(--muted)}.topic{display:inline-block;margin-top:48px;padding:6px 10px;border:1px solid var(--accent);border-radius:99px;color:var(--accent);font-size:9px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}h1{font:500 clamp(38px,5vw,62px)/1.02 Georgia,"Times New Roman",serif;letter-spacing:-.035em;max-width:90%;margin:17px 0 25px}.bar{width:66px;height:4px;background:var(--accent);margin-bottom:25px}.article{font:var(--fs)/var(--lh) Georgia,"Times New Roman",serif;white-space:pre-wrap}.folio{position:absolute;bottom:4%;left:var(--pad);right:var(--pad);border-top:1px solid var(--rule);padding-top:8px;display:flex;justify-content:space-between;color:var(--muted);font-size:8px;letter-spacing:.14em}.mobile{display:none}@media(max-width:850px){.app{padding:8px}.layout{display:block}.panel{margin-bottom:8px}textarea{min-height:210px}.sheet{min-height:0;width:100%;padding:7.8%}.stage{padding:7px}.desktop{display:none}.mobile{display:flex;gap:7px;width:100%}h1{font-size:clamp(30px,8vw,49px)}.article{font-size:calc(var(--fs)*.82)}}@media print{body,.stage{background:#fff}.toolbar,.panel{display:none}.app,.layout,.stage{display:block;margin:0;padding:0}.sheet{width:210mm;height:297mm;box-shadow:none}}</style></head><body><div class="app"><div class="toolbar"><div class="brand">FRENCH SHEET</div><button class="swatch" data-t="sage" title="Sauge" style="background:#7d8c79"></button><button class="swatch" data-t="blue" title="Bleu gris" style="background:#71818c"></button><button class="swatch" data-t="wine" title="Bordeaux poudré" style="background:#936f73"></button><button class="swatch" data-t="ochre" title="Ocre" style="background:#a18a64"></button><button class="swatch" data-t="lavender" title="Lavande grise" style="background:#817b91"></button><button id="pdf" class="desktop">PDF / 打印</button><button id="png" class="primary desktop">导出 PNG</button><div class="mobile"><button id="edit">收起编辑</button><button id="pdf2">PDF</button><button id="png2" class="primary">PNG</button></div></div><div class="layout"><section class="panel" id="panel"><textarea id="input" placeholder="粘贴每日语料：&#10;&#10;【主题】：科技前沿&#10;【标题】：...&#10;【正文】：..."></textarea><div class="settings"><label>正文字号<input id="fs" type="range" min="16" max="27" value="20"></label><label>行距<input id="lh" type="range" min="1.6" max="2.8" step=".05" value="2.15"></label><label>页面留白<input id="pad" type="range" min="6" max="13" step=".5" value="8.5"></label><label>显示日期 <input id="showdate" type="checkbox" checked></label></div><p class="hint">自动识别【主题】【标题】【正文】。文本与偏好仅保存在当前浏览器。</p></section><main class="stage"><article class="sheet" id="sheet"><header class="mast"><div class="kicker">Français · Daily Reading</div><div class="date" id="date"></div></header><div class="topic" id="topic">LECTURE</div><h1 id="title">Votre lecture du jour</h1><div class="bar"></div><div class="article" id="article">Collez votre texte. La mise en page se fera automatiquement.</div><footer class="folio"><span>B1 · B2</span><span>ANNOTATION EDITION</span></footer></article></main></div></div><script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script><script>const $=s=>document.querySelector(s),R=document.documentElement,I=$("#input");const themes={sage:["#f2efe7","#292925","#777269","#7d8c79","#cec8bc"],blue:["#eef0ef","#292d30","#70777a","#71818c","#c8cdcc"],wine:["#f2ece9","#302829","#7b6e6d","#936f73","#d2c6c2"],ochre:["#f2eee4","#302d26","#7a7367","#a18a64","#d4cabb"],lavender:["#efedf0","#2e2b31","#747078","#817b91","#cdc8d1"]};function theme(n){let t=themes[n]||themes.sage;["paper","ink","muted","accent","rule"].forEach((k,i)=>R.style.setProperty("--"+k,t[i]));localStorage.fsTheme=n}function grab(v,a,b){let x=v.indexOf("【"+a+"】");if(x<0)return"";x=v.indexOf("：",x);if(x<0)x=v.indexOf(":",x);if(x<0)return"";x++;let y=b?v.indexOf("【"+b+"】",x):-1;return v.slice(x,y<0?v.length:y).trim()}function render(){let v=I.value;$("#topic").textContent=grab(v,"主题","标题")||"LECTURE";$("#title").textContent=grab(v,"标题","正文")||"Votre lecture du jour";$("#article").textContent=grab(v,"正文")||"Collez votre texte. La mise en page se fera automatiquement.";localStorage.fsInput=v}I.value=localStorage.fsInput||"";I.oninput=render;render();document.querySelectorAll(".swatch").forEach(b=>b.onclick=()=>theme(b.dataset.t));theme(localStorage.fsTheme||"sage");$("#date").textContent=new Intl.DateTimeFormat("fr-FR",{day:"2-digit",month:"long",year:"numeric"}).format(new Date()).toUpperCase();[["fs","--fs","px"],["lh","--lh",""] ,["pad","--pad","%"]].forEach(([id,key,u])=>{let e=$("#"+id),s=localStorage["fs"+id];if(s)e.value=s;let f=()=>{R.style.setProperty(key,e.value+u);localStorage["fs"+id]=e.value};e.oninput=f;f()});$("#showdate").onchange=e=>$("#date").style.visibility=e.target.checked?"visible":"hidden";async function png(){if(typeof html2canvas==="undefined"){alert("首次导出 PNG 需要联网加载渲染组件。");return}let c=await html2canvas($("#sheet"),{scale:3,backgroundColor:null,useCORS:true});let a=document.createElement("a");a.download="French_"+new Date().toISOString().slice(0,10)+"_Text.png";a.href=c.toDataURL("image/png");a.click()}$("#png").onclick=$("#png2").onclick=png;$("#pdf").onclick=$("#pdf2").onclick=()=>window.print();$("#edit").onclick=()=>{let p=$("#panel"),h=p.style.display==="none";p.style.display=h?"block":"none";$("#edit").textContent=h?"收起编辑":"展开编辑"};if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});</script></body></html>
